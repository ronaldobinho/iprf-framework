# IPRF — local development infrastructure.
#
# SYNTHETIC DATA ONLY. Credentials come from .env (see .env.example); nothing is
# hardcoded here. Services sit on a dedicated bridge network so that this stack
# never shares a network namespace with anything else on the host — the same
# isolation posture the production VPS requires, rehearsed locally.

name: iprf

services:
  postgres:
    image: postgres:16-alpine
    container_name: iprf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iprf}
      POSTGRES_USER: ${POSTGRES_USER:-iprf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iprf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iprf} -d ${POSTGRES_DB:-iprf}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iprf-redis
    # Backs the pre-computed RiskStateStore read in-path by Layers 1-3.
    # Append-only persistence so a restart does not silently empty risk state.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - iprf-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iprf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-iprf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required — copy .env.example to .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - iprf-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  iprf-net:
    driver: bridge
